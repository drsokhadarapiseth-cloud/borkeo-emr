<!doctype html>
<html lang="km">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1200, user-scalable=yes">
  <title>ផែនទីផ្នែក — Borkeo EMR</title>
  <link rel="stylesheet" href="/public/ocean-theme.css">
  <link rel="stylesheet" href="/public/emr-session.css?v=1200">
  <link rel="stylesheet" href="/public/departments.css?v=1970">
  <script src="/public/emr-session.js?v=1970" defer></script>
  <script src="/public/departments.js?v=1970" defer></script>
  <link rel="stylesheet" href="/public/responsive-layout.css?v=1310">
</head>
<body>
  <main class="department-shell">
    <section class="department-page-banner" data-session-host>
      <div class="banner-copy">
        <h1 data-i18n="title">ផែនទីផ្នែក និងការចូលសម្រាកពេទ្យ</h1>
        
      </div>
      <img src="/public/logo-hospital.jpg" alt="Borkeo Referral Hospital">
    </section>

    <section class="map-panel">
      <header class="map-toolbar">
        <div>
          <h2 data-i18n="mapHeading">ផែនទីគ្រែមន្ទីរពេទ្យ</h2>
          <p data-i18n="mapHint">អ្នកជំងឺ IPD ដែលបានចុះឈ្មោះនឹងបង្ហាញក្នុងបញ្ជីរង់ចាំ។</p>
        </div>
        <div class="toolbar-actions">
          <label class="ward-filter-label" for="ward-filter">
            <span data-i18n="chooseWard">ជ្រើសរើសផ្នែក</span>
            <select id="ward-filter" aria-label="ជ្រើសរើសផ្នែក">
              <option value="" data-i18n="allWards">ផ្នែកទាំងអស់</option>
            </select>
          </label>
          
          <button type="button" id="language-button" hidden aria-hidden="true" tabindex="-1"></button>
          <button type="button" class="button secondary" id="refresh-button" data-i18n="refresh">ទាញឡើងវិញ</button>
          <button type="button" class="button" id="add-department-button" data-i18n="addDepartment">+ បន្ថែមផ្នែក</button>
          <button type="button" class="button success" id="save-map-button" data-i18n="saveMap">រក្សាទុក</button>
        </div>
      </header>

      <div id="map-status" class="map-status" role="status" aria-live="polite"></div>
      <div class="map-layout">
        <section class="department-grid" id="hospital-map" aria-label="Hospital departments"></section>
        <aside class="admission-sidebar">
          <header>
            <h2 data-i18n="pending">អ្នកជំងឺរង់ចាំចូលសម្រាក</h2>
            <span class="count-badge" id="pending-count">0</span>
          </header>
          <div id="pending-admissions"></div>
        </aside>
      </div>
    </section>
  </main>
</body>
</html>
