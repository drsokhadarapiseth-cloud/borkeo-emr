<!doctype html><html lang="km"><head><meta charset="utf-8"><meta name="viewport" content="width=1200, user-scalable=yes"><title>ការស្នើសុំ · Borkeo EMR</title><link rel="stylesheet" href="/public/ocean-theme.css"><link rel="stylesheet" href="/public/emr-session.css"><link rel="stylesheet" href="/public/requests.css?v=2060"><script src="/public/emr-session.js?v=2060" defer></script><script src="/public/nationalities.js?v=3500" defer></script><script src="/public/requests.js?v=2060" defer></script><link rel="stylesheet" href="/public/responsive-layout.css?v=1310"></head><body><main class="requests-shell"><header data-session-host><h1>ការស្នើសុំ</h1></header><section class="request-panel"><h2>ការស្នើសុំ</h2><nav id="request-tabs" class="request-tabs" aria-label="Request types"></nav><div class="request-toolbar"><label>ស្ថានភាព<select id="request-status"><option value="PENDING">រង់ចាំ</option><option value="APPROVED">អនុម័ត</option><option value="REJECTED">បដិសេធ</option><option value="PREPARING">កំពុងរៀបចំ</option><option value="ALL">ទាំងអស់</option></select></label><label>ស្វែងរក<input id="request-search" type="search"></label><button id="request-refresh" type="button">ទាញឡើងវិញ</button><button id="request-new" type="button">ស្នើសុំលើកលែងសេវា</button><button id="request-bulk-approve" type="button" class="success" style="display:none;background:#059669;color:#fff;border:none;padding:7px 16px;border-radius:8px;font-weight:bold;cursor:pointer;">✔ អនុម័តទាំងអស់ដែលបានជ្រើស (<span id="request-selected-count">0</span>)</button></div><p id="request-notice" role="status" aria-live="polite"></p><div class="request-table-wrap"><table class="request-table"><thead><tr><th style="width:40px;text-align:center;"><input type="checkbox" id="request-select-all" title="ជ្រើសរើសទាំងអស់"></th><th>អ្នកជំងឺ</th><th>ផ្នែក</th><th>កាលបរិច្ឆេទ</th><th>ស្ថានភាព</th><th>សកម្មភាព</th></tr></thead><tbody id="request-list"></tbody></table></div><section id="request-detail" hidden tabindex="-1"></section><dialog id="request-feedback"><form method="dialog"><h3>មតិកែតម្រូវ</h3><textarea id="feedback-note" required maxlength="1000"></textarea><p id="feedback-error" role="alert"></p><div class="request-actions"><button value="cancel" formnovalidate>បោះបង់</button><button id="feedback-send" type="button" class="danger">បដិសេធ</button></div></form></dialog><dialog id="fee-dialog"><form id="fee-form"><h3>ស្នើសុំលើកលែងសេវា</h3><label>អ្នកជំងឺ<select id="fee-patient" required></select></label><label>វិក្កយបត្រ<select id="fee-invoice" required></select></label><label>របៀបបញ្ចុះ<select id="fee-mode"><option value="PERCENT">ភាគរយ (100% = ឥតគិតថ្លៃ)</option><option value="FIXED">ចំនួនទឹកប្រាក់</option></select></label><label id="fee-percent-wrap">ភាគរយបញ្ចុះតម្លៃ (100 = ឥតគិតថ្លៃ)<input id="fee-percent" type="number" min="0.01" step="0.01" max="100" value="100" required></label><label id="fee-amount-wrap" hidden>ចំនួនទឹកប្រាក់<input id="fee-amount" type="number" min="0" step="0.01" value="0"><select id="fee-currency"><option value="KHR">KHR</option><option value="USD">USD</option></select></label><fieldset><legend>សេវាដែលស្នើ</legend><div id="fee-services"></div></fieldset><label>មូលហេតុ<textarea id="fee-reason" required maxlength="1000"></textarea></label><p id="fee-error" role="alert"></p><div class="request-actions"><button id="fee-cancel" type="button">បោះបង់</button><button type="submit">ផ្ញើសំណើ</button></div></form></dialog></section></main></body></html>
