<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PNC Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Khmer OS', 'Suwannaphum', sans-serif;
            padding: 20px;
        }
        .card {
            border: 1px solid #dee2e6;
            margin-bottom: 20px;
            border-radius: 6px;
            box-shadow: none;
        }
        .card-header {
            background-color: #e9eff5;
            color: #0b5ed7;
            font-weight: bold;
            border-bottom: 1px solid #dee2e6;
            padding: 10px 15px;
        }
        .form-label {
            font-size: 0.9rem;
            color: #333;
            margin-bottom: 0.3rem;
        }
        .text-danger {
            color: #dc3545 !important;
        }
        .form-control, .form-select {
            font-size: 0.9rem;
            color: #6c757d;
        }
        .dashed-divider {
            border-top: 1px dashed #dee2e6;
            margin: 15px 0;
        }
    </style>
</head>
<body>

<div class="container-fluid bg-white p-4 rounded border">

    <!-- Maternity and Gynecology Section -->
    <div class="card">
        <div class="card-header">ផ្នែកសម្ភព និងរោគស្ត្រី</div>
        <div class="card-body">
            
            <div class="row align-items-center mb-3">
                <div class="col-md-1">
                    <label class="form-label mb-0">ទម្រង់</label>
                </div>
                <div class="col-md-11">
                    <select class="form-select">
                        <option selected>ថែទាំក្រោយសំរាល</option>
                    </select>
                </div>
            </div>

            <div class="dashed-divider"></div>

            <div class="mb-3 d-flex align-items-center gap-4">
                <label class="form-label mb-0">ករណីជំងឺ <span class="text-danger">*</span></label>
                <div class="form-check mb-0">
                    <input class="form-check-input" type="radio" name="caseType" id="newCase">
                    <label class="form-check-label" for="newCase">ករណីថ្មី</label>
                </div>
                <div class="form-check mb-0">
                    <input class="form-check-input" type="radio" name="caseType" id="oldCase">
                    <label class="form-check-label" for="oldCase">ករណីចាស់</label>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">រោគសញ្ញា <span class="text-danger">*</span></label>
                <select class="form-select">
                    <option selected>ជ្រើសរើស</option>
                </select>
            </div>

            <div class="row">
                <div class="col-md-8">
                    <label class="form-label">រោគវិនិច្ឆ័យចូល ICD10 <span class="text-danger">*</span></label>
                    <select class="form-select">
                        <option selected>ជ្រើសរើស</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">សេវាអមវេជ្ជសាស្ត្រ <span class="text-danger">*</span></label>
                    <div class="d-flex gap-3 mt-1">
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="medicalService" id="medYes">
                            <label class="form-check-label" for="medYes">មាន</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="medicalService" id="medNo" checked>
                            <label class="form-check-label" for="medNo">មិនមាន</label>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Postpartum Care Section -->
    <div class="card">
        <div class="card-header">ការថែទាំក្រោយសម្រាលកូន</div>
        <div class="card-body">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">កាលបរិច្ឆេទចូលថែទាំ <span class="text-danger">*</span></label>
                    <input type="date" class="form-control" placeholder="ជ្រើសរើសកាលបរិច្ឆេទ">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">ចំនួនថ្ងៃក្រោយសម្រាលកូន <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" placeholder="សូមបញ្ចូល">
                </div>
            </div>
        </div>
    </div>

    <!-- Mother's Care Section -->
    <div class="card border-top-0 rounded-top-0 mt-n4" style="margin-top: -21px;">
        <div class="card-header">ការថែទាំម្តាយ</div>
        <div class="card-body">
            <div class="mb-3">
                <label class="form-label">សញ្ញាគ្រោះថ្នាក់របស់ម្តាយ/ការព្យាបាល</label>
                <input type="text" class="form-control">
            </div>
            
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">គ្រាប់ថ្នាំជាតិដែក/អាស៊ីដហ្វូលីក</label>
                    <input type="text" class="form-control">
                </div>
                <div class="col-md-6">
                    <label class="form-label">មេបេនដាហ្សូល(500mg)</label>
                    <input type="text" class="form-control">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">តេតាណុស</label>
                <select class="form-select">
                    <option selected>ជ្រើសរើស</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Baby's Care Section -->
    <div class="card">
        <div class="card-header">ការថែទាំកូន</div>
        <div class="card-body">
            <div class="mb-3">
                <label class="form-label">សញ្ញាគ្រោះថ្នាក់របស់ទារក/ការព្យាបាល</label>
                <input type="text" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">ពិនិត្យមើលការបំបៅដោះ</label>
                <input type="text" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">ការផ្តល់ថ្នាំបង្ការ</label>
                <select class="form-select">
                    <option selected>ជ្រើសរើស</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">ការផ្តល់ប្រឹក្សា</label>
                <input type="text" class="form-control">
            </div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
