<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMR - បញ្ជីអ្នកជំងឺ</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Kantumruy Pro', sans-serif;
            background-color: #f3f4f6; /* Light gray background */
            color: #374151;
        }
        /* Custom scrollbar for table */
        .table-container::-webkit-scrollbar {
            height: 8px;
        }
        .table-container::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 4px;
        }
    </style>
</head>
<body class="p-4 md:p-6">

    <!-- Top Breadcrumb -->
    <div class="mb-4 flex items-center gap-2 text-emerald-600 text-sm font-medium">
        <i class="fa-solid fa-house"></i>
        <span>ទំព័រដើម</span>
    </div>

    <!-- Main Card Container -->
    <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
        
        <!-- Header -->
        <div class="px-6 py-4 border-b border-gray-200">
            <h2 class="text-xl font-bold text-emerald-700">បញ្ជីអ្នកជំងឺ</h2>
        </div>

        <!-- Filter Section -->
        <div class="bg-emerald-50/50 p-4 border-b border-emerald-100 grid grid-cols-1 md:grid-cols-4 gap-4">
            
            <!-- Entry Date -->
            <div class="flex flex-col gap-1">
                <label class="text-xs font-semibold text-gray-700">កាលបរិច្ឆេទចូល</label>
                <div class="relative">
                    <input type="text" placeholder="ជ្រើសរើសកាលបរិច្ឆេទ" class="w-full pl-3 pr-8 py-2 text-sm border border-gray-300 rounded focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 bg-white">
                    <i class="fa-regular fa-calendar absolute right-3 top-2.5 text-gray-400"></i>
                </div>
            </div>

            <!-- Exit Date -->
            <div class="flex flex-col gap-1">
                <label class="text-xs font-semibold text-gray-700">កាលបរិច្ឆេទចេញ</label>
                <div class="relative">
                    <input type="text" placeholder="ជ្រើសរើសកាលបរិច្ឆេទ" class="w-full pl-3 pr-8 py-2 text-sm border border-gray-300 rounded focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 bg-white">
                    <i class="fa-regular fa-calendar absolute right-3 top-2.5 text-gray-400"></i>
                </div>
            </div>

            <!-- Department -->
            <div class="flex flex-col gap-1">
                <label class="text-xs font-semibold text-gray-700">ផ្នែក</label>
                <div class="relative">
                    <select class="w-full pl-3 pr-8 py-2 text-sm border border-gray-300 rounded focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 bg-white appearance-none text-gray-400">
                        <option value="">ជ្រើសរើស</option>
                        <option value="1">ផ្នែកជំងឺកុមារ</option>
                        <option value="2">ផ្នែកសង្គ្រោះបន្ទាន់</option>
                    </select>
                    <i class="fa-solid fa-chevron-down absolute right-3 top-3 text-gray-400 text-xs"></i>
                </div>
            </div>

            <!-- Payment Type -->
            <div class="flex flex-col gap-1">
                <label class="text-xs font-semibold text-gray-700">ប្រភេទនៃការបង់</label>
                <div class="relative">
                    <select class="w-full pl-3 pr-8 py-2 text-sm border border-gray-300 rounded focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 bg-white appearance-none text-gray-400">
                        <option value="">ជ្រើសរើស</option>
                    </select>
                    <i class="fa-solid fa-chevron-down absolute right-3 top-3 text-gray-400 text-xs"></i>
                </div>
            </div>

        </div>

        <!-- Toolbar / Pagination Top -->
        <div class="px-6 py-3 border-b border-gray-200 flex flex-wrap items-center justify-between gap-4 bg-white">
            
            <!-- Left: Rows per page & Total -->
            <div class="flex items-center gap-4 text-sm text-gray-700">
                <div class="flex items-center gap-2">
                    <span>ចំនួនជួរក្នុងមួយទំព័រ:</span>
                    <select class="border border-gray-300 rounded px-2 py-1 focus:outline-none focus:border-emerald-500">
                        <option>10</option>
                        <option>25</option>
                        <option>50</option>
                    </select>
                </div>
                <!-- Updated total to 0 -->
                <span class="font-medium">សរុប 0</span>
            </div>

            <!-- Right: Action Buttons & Pagination -->
            <div class="flex items-center gap-4">
                <div class="flex gap-2">
                    <button class="px-3 py-1.5 text-xs border border-gray-300 rounded hover:bg-gray-50 flex items-center gap-2 text-gray-700 transition-colors">
                        ការគ្រប់គ្រង <i class="fa-solid fa-barcode"></i>
                    </button>
                    <button class="px-3 py-1.5 text-xs border border-gray-300 rounded hover:bg-gray-50 flex items-center gap-2 text-gray-700 transition-colors">
                        កំណត់ឡើងវិញ <i class="fa-solid fa-rotate-right"></i>
                    </button>
                </div>

                <!-- Updated Pagination for empty state -->
                <div class="flex items-center gap-1 text-sm">
                    <span class="mr-2 text-gray-600">ទំព័រទី 0 នៃ 0</span>
                    <button disabled class="w-8 h-8 flex items-center justify-center border border-gray-200 rounded text-gray-300 cursor-not-allowed"><i class="fa-solid fa-angles-left text-xs"></i></button>
                    <button disabled class="w-8 h-8 flex items-center justify-center border border-gray-200 rounded text-gray-300 cursor-not-allowed"><i class="fa-solid fa-angle-left text-xs"></i></button>
                    <button disabled class="w-8 h-8 flex items-center justify-center border border-gray-200 rounded text-gray-300 cursor-not-allowed"><i class="fa-solid fa-angle-right text-xs"></i></button>
                    <button disabled class="w-8 h-8 flex items-center justify-center border border-gray-200 rounded text-gray-300 cursor-not-allowed"><i class="fa-solid fa-angles-right text-xs"></i></button>
                </div>
            </div>
        </div>

        <!-- Table Data -->
        <div class="table-container w-full overflow-x-auto pb-4">
            <table class="w-full text-sm text-left min-w-[1200px]">
                <thead class="text-xs text-gray-700 bg-emerald-50/60 border-b border-gray-200">
                    <tr>
                        <th class="px-4 py-3 font-bold w-12">លេខ</th>
                        <th class="px-4 py-3 font-bold min-w-[140px]">ឈ្មោះអ្នកជំងឺ</th>
                        <th class="px-4 py-3 font-bold w-16">ភេទ</th>
                        <th class="px-4 py-3 font-bold min-w-[150px]">អាយុ</th>
                        <th class="px-4 py-3 font-bold">លេខទូរសព្ទ</th>
                        <th class="px-4 py-3 font-bold">លេខប័ណ្ណសុខភាព</th>
                        <th class="px-4 py-3 font-bold">លេខប័ណ្ណសមធម៌</th>
                        <th class="px-4 py-3 font-bold min-w-[180px]">ប្រភេទប័ណ្ណ</th>
                        <th class="px-4 py-3 font-bold">ផ្នែកចូល</th>
                        <th class="px-4 py-3 font-bold">កាលបរិច្ឆេទចូល</th>
                        <th class="px-4 py-3 font-bold">កាលបរិច្ឆេទចេញ</th>
                        <th class="px-4 py-3 font-bold text-center w-24">ប្រតិបត្តិការ</th>
                    </tr>
                </thead>
                <!-- Added ID here for JavaScript injection -->
                <tbody id="patientTableBody" class="divide-y divide-gray-200">
                    
                    <!-- EMPTY STATE ROW -->
                    <tr>
                        <td colspan="12" class="px-4 py-12 text-center bg-gray-50/50">
                            <div class="flex flex-col items-center justify-center text-gray-400">
                                <div class="bg-gray-100 p-4 rounded-full mb-3">
                                    <i class="fa-solid fa-user-injured text-3xl text-gray-300"></i>
                                </div>
                                <h3 class="text-base font-semibold text-gray-600 mb-1">មិនទាន់មានទិន្នន័យនៅឡើយទេ</h3>
                                <p class="text-sm">កំពុងរង់ចាំការបញ្ចូលទិន្នន័យពីការចុះឈ្មោះអ្នកជំងឺថ្មី។</p>
                            </div>
                        </td>
                    </tr>

                </tbody>
            </table>
        </div>
    </div>

</body>
</html>
