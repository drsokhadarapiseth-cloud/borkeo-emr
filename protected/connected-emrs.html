<!doctype html><html lang="km"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>បណ្ដាញមូលដ្ឋានសុខាភិបាល</title><link rel="stylesheet" href="/public/emr-session.css?v=3700"><link rel="stylesheet" href="/public/responsive-layout.css?v=3045"><link rel="stylesheet" href="/public/emr-network.css?v=5030"><script src="/public/emr-session.js?v=3700" defer></script></head><body><main class="network-shell"><h1>បណ្ដាញមូលដ្ឋានសុខាភិបាល</h1><p role="status" data-network-status></p>
<section class="network-card" aria-label="តារាងការតភ្ជាប់ API"><h2>មូលដ្ឋានសុខាភិបាលដែលបានតភ្ជាប់</h2><div data-connection-table></div></section>
<section class="network-card"><h2>អ្នកប្រើប្រាស់តាមមូលដ្ឋានសុខាភិបាល</h2><label>ជ្រើសរើសមូលដ្ឋានសុខាភិបាល<select data-network-peer></select></label><p role="status" data-directory-status></p><div class="network-scroll" data-staff-directory></div>
<div data-doctor-section hidden><h2>សារឯកជនរវាងបុគ្គលិកសុខាភិបាល</h2><form data-network-compose><label>អ្នកទទួល<select name="recipient" required></select></label><label>ប្រធានបទ<input name="subject" required maxlength="200"></label><label>អត្ថបទសារ<textarea name="body" required maxlength="6000"></textarea></label><label>ឯកសារភ្ជាប់<input class="network-file-input" type="file" name="attachments" multiple accept=".pdf,.png,.jpg,.jpeg"><span class="network-file-button" data-file-button></span></label><output data-file-names aria-live="polite"></output><p>ឯកសាររូបភាព ឬឯកសារបោះពុម្ព៖ អតិបរមា ៣ ឯកសារ មួយឯកសារ ៥១២ គីឡូបៃ និងសរុប ១ មេកាបៃ</p><button type="submit">បញ្ជូនសារ</button></form><h2>សាររបស់ខ្ញុំ</h2><div data-network-messages></div></div></section>
</main><script type="module" src="/public/connected-emrs.mjs?v=5030"></script></body></html>
