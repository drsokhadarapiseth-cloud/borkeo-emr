<!doctype html><html lang="km"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>មូលដ្ឋានសុខាភិបាលដែលបានតភ្ជាប់</title><link rel="stylesheet" href="/public/emr-session.css?v=3700"><link rel="stylesheet" href="/public/responsive-layout.css?v=3045"><link rel="stylesheet" href="/public/emr-network.css?v=4990"><link rel="stylesheet" href="/public/referral-form.css?v=4940"><script src="/public/emr-session.js?v=3700" defer></script></head><body><main class="network-shell"><h1>មូលដ្ឋានសុខាភិបាលដែលបានតភ្ជាប់</h1><p role="status" data-network-status></p><label>ជ្រើសរើសមូលដ្ឋានសុខាភិបាល<select data-network-peer></select></label>
<section class="network-card" aria-label="តារាងការតភ្ជាប់ API"><div data-connection-table></div></section>
<section class="network-card"><h2>ស្វែងរកអ្នកជំងឺពីមូលដ្ឋានផ្សេង</h2><form data-network-search><label>ឈ្មោះ លេខសម្គាល់ ឬទូរស័ព្ទ<input name="q" required minlength="3" maxlength="120"></label><button type="submit">ស្វែងរក</button></form><div class="network-scroll" data-network-results></div></section>
<section class="network-card" data-doctor-section hidden><h2>សាររវាងវេជ្ជបណ្ឌិត</h2><form data-network-compose><label>អ្នកទទួល<select name="recipient" required></select></label><label>ប្រធានបទ<input name="subject" required maxlength="200"></label><label>អត្ថបទសារ<textarea name="body" required maxlength="6000"></textarea></label><button type="submit">បញ្ជូនសារ</button></form><h2>សាររបស់ខ្ញុំ</h2><div data-network-messages></div></section>
</main><script type="module" src="/public/connected-emrs.mjs?v=4980"></script></body></html>
