<!doctype html>
<html lang="km"><head><meta charset="utf-8"><meta name="viewport" content="width=1200, user-scalable=yes">
<title>បញ្ជីចែកឱសថ · Borkeo EMR</title>
<link rel="stylesheet" href="/public/ocean-theme.css"><link rel="stylesheet" href="/public/emr-session.css?v=1200">
<link rel="stylesheet" href="/public/pharmacy-opd.css?v=1500">
<script src="/public/emr-session.js?v=1970" defer></script><script src="/public/pharmacy-opd.js?v=1500" defer></script>
  <link rel="stylesheet" href="/public/responsive-layout.css?v=1310">
</head><body><main class="pharmacy-shell">
<header class="pharmacy-heading" data-session-host><div><h1>ចែកឱសថ</h1><span>អ្នកជំងឺ OPD និងអ្នកជំងឺ IPD ដែលបានចេញពីពេទ្យ</span></div><a class="pharmacy-display-link" href="/pharmacy/display" target="_blank">បើកផ្ទាំងលេខរៀង</a><!-- v42.5: the Head of Pharmacy approves the maximum doses there --><a class="pharmacy-display-link" href="/admin/drug-safety">តារាងសុវត្ថិភាពឱសថ</a></header>
<section class="pharmacy-toolbar"><label>ស្វែងរកអ្នកជំងឺ <input type="search" id="pharmacy-search" placeholder="ឈ្មោះ លេខករណី ឬលេខបណ្ណសុខភាព"></label><button type="button" id="pharmacy-refresh">ទាញទិន្នន័យ</button><a class="tv-display-tab" href="/pharmacy/display" target="_blank">បើកផ្ទាំងលេខរៀង</a><strong id="pharmacy-count"></strong></section>
<p id="pharmacy-status" role="status"></p>
<div class="pharmacy-columns">
  <section class="pharmacy-panel"><header><h2>OPD</h2><span id="pharmacy-opd-count"></span></header><div class="pharmacy-table-wrap"><table><thead><tr><th>ល.រ.</th><th>លេខរៀង OPD</th><th>អ្នកជំងឺ</th><th>ឱសថ</th><th>ស្ថានភាព</th></tr></thead><tbody id="pharmacy-rows"></tbody></table></div></section>
  <section class="pharmacy-panel"><header><h2>IPD · បានចេញពីពេទ្យ</h2><span id="pharmacy-ipd-count"></span></header><div class="pharmacy-table-wrap"><table><thead><tr><th>ល.រ.</th><th>អ្នកជំងឺ / លេខករណី</th><th>ថ្ងៃចេញ</th><th>ថ្នាំ</th><th>ស្ថានភាព</th></tr></thead><tbody id="discharge-pharmacy-rows"></tbody></table></div></section>
</div>
</main>
<div class="pharmacy-overlay" id="pharmacy-overlay" hidden><section class="pharmacy-dialog" role="dialog" aria-modal="true" aria-labelledby="prescription-title"><header><h2 id="prescription-title">វេជ្ជបញ្ជា OPD</h2><button id="close-prescription" type="button" aria-label="បិទ">×</button></header><div id="prescription-body"></div><footer id="prescription-actions"><label><input id="received-checkbox" type="checkbox"> បានផ្ដល់ថ្នាំរួចរាល់</label><span id="prescription-status" role="status"></span></footer></section></div>
</body></html>
