<!doctype html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Record view log</title>
<link rel="stylesheet" href="/public/emr-session.css?v=3700">
<link rel="stylesheet" href="/public/responsive-layout.css?v=3045">
<link rel="stylesheet" href="/public/drug-safety.css?v=4120">
<script src="/public/emr-session.js?v=3700" defer></script>
<script src="/public/record-log.js?v=4170" defer></script>
</head>
<body class="ds-page">
<!-- v41.7: record view log viewer (Admin and Directors): every opening, printing,
     export and scanned document view of a patient record. -->
<main class="ds-shell">
  <div data-session-host></div>
  <header class="ds-hero">
    <h1>កំណត់ត្រាអ្នកបើកមើលឯកសារ</h1>
    <p data-new-text="recordLog.intro">Who opened, printed or exported a patient record, and when.</p>
  </header>
  <section class="ds-panel">
    <form class="ds-form" id="rl-filters">
      <label><span data-new-text="recordLog.patient">Patient (code or name)</span><input name="patient" maxlength="120"></label>
      <label><span data-new-text="recordLog.user">Staff (username or name)</span><input name="user" maxlength="120"></label>
      <label><span data-new-text="recordLog.action">Action</span><select name="action">
        <option value=""></option>
        <option value="open" data-new-text="recordLog.open">Opened</option>
        <option value="print" data-new-text="recordLog.print">Printed</option>
        <option value="export" data-new-text="recordLog.export">Exported</option>
        <option value="document" data-new-text="recordLog.document">Scanned document opened</option>
      </select></label>
      <label><span data-new-text="recordLog.from">From</span><input name="from" type="date"></label>
      <label><span data-new-text="recordLog.to">To</span><input name="to" type="date"></label>
      <button type="submit" data-new-text="recordLog.search">Search</button>
    </form>
    <p id="ds-status" role="status" aria-live="polite"></p>
    <div class="ds-table-wrap"><table class="ds-table" id="rl-table"></table></div>
  </section>
</main>
</body>
</html>
