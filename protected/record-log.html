<!doctype html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>កំណត់ត្រាអ្នកបើកមើលឯកសារ</title>
<link rel="stylesheet" href="/public/emr-session.css?v=3700">
<link rel="stylesheet" href="/public/responsive-layout.css?v=3045">
<link rel="stylesheet" href="/public/drug-safety.css?v=4120">
<script src="/public/emr-session.js?v=3700" defer></script>
<script src="/public/record-log.js?v=4170" defer></script>
</head>
<body class="ds-page">
<!-- v41.7: record view log viewer (Admin and Directors): every opening, printing,
     export and scanned document view of a patient record. -->
<main class="ds-shell">
  <div data-session-host></div>
  <header class="ds-hero">
    <h1>កំណត់ត្រាអ្នកបើកមើលឯកសារ</h1>
    <p data-record-log-text="recordLog.intro">កំណត់ត្រាអ្នកបើកមើលឯកសារ</p>
  </header>
  <section class="ds-panel">
    <form class="ds-form" id="rl-filters">
      <label><span data-record-log-text="recordLog.patient">អ្នកជំងឺ (លេខកូដ ឬឈ្មោះ)</span><input name="patient" maxlength="120"></label>
      <label><span data-record-log-text="recordLog.user">បុគ្គលិក (គណនី ឬឈ្មោះ)</span><input name="user" maxlength="120"></label>
      <label><span data-record-log-text="recordLog.action">សកម្មភាព</span><select name="action">
        <option value=""></option>
        <option value="open" data-record-log-text="recordLog.open">បើកមើល</option>
        <option value="print" data-record-log-text="recordLog.print">បោះពុម្ព</option>
        <option value="export" data-record-log-text="recordLog.export">នាំចេញ</option>
        <option value="document" data-record-log-text="recordLog.document">បើកមើលឯកសារស្កេន</option>
      </select></label>
      <label><span data-record-log-text="recordLog.from">ចាប់ពី</span><input name="from" type="date"></label>
      <label><span data-record-log-text="recordLog.to">ដល់</span><input name="to" type="date"></label>
      <button type="submit" data-record-log-text="recordLog.search">ស្វែងរក</button>
    </form>
    <p id="ds-status" role="status" aria-live="polite"></p>
    <div class="ds-table-wrap"><table class="ds-table" id="rl-table"></table></div>
  </section>
</main>
</body>
</html>
