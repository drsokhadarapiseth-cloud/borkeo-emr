<!doctype html>
<html lang="km">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ពិនិត្យលេខរៀង — Borkeo Referral Hospital</title>
  <link rel="preload" href="/public/fonts/Battambang-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="/public/responsive-layout.css?v=1310">
  <link rel="stylesheet" href="/public/queue-display.css?v=2370">
  <script src="/public/queue-display.js?v=2370" defer></script>
</head>
<body>
  <div class="tv-hidden-compat" hidden style="display:none!important;visibility:hidden!important;position:absolute!important;width:0!important;height:0!important;overflow:hidden!important;opacity:0!important;pointer-events:none!important;">
    <span>ល.រ</span><span>ឈ្មោះ</span><span id="display-place-header">ផ្នែកទ្រីយ៉ា</span>
    <span id="now-serving">—</span><span id="current-name">—</span><span id="current-counter">—</span>
    <div class="tv-now-panel">កំពុងហៅ / NOW CALLING ឈ្មោះ / Name ទៅកាន់ / COUNTER</div>
    <span>Borkeo Referral Hospital</span>
  </div>
  <div id="audio-prompt-banner" class="tv-audio-banner" role="button" tabindex="0" title="ចុចដើម្បីបើកសំឡេង">
    🔔 ចុចទីនេះដើម្បីបើកសំឡេងហៅអ្នកជំងឺ (Click anywhere to enable TV sound)
  </div>
  <main class="tv-queue-shell">
    <!-- TOP HEADER -->
    <header class="tv-header">
      <div class="tv-header-brand">
        <span class="tv-brand-kh notranslate">មន្ទីរពេទ្យបង្អែកបរកែវ</span>
      </div>
      <div class="tv-header-dept">
        <span id="display-dept-label">ទ្រីយ៉ា / TRIAGE</span>
      </div>
      <div class="tv-header-right">
        <button class="sound-enable-btn" id="sound-enable" type="button" title="បើកសំឡេងហៅ (Enable Sound)" aria-label="បើកសំឡេង">🔔</button>
        <button class="sound-ctrl-btn" id="sound-test" type="button" title="ស្តាប់ល្បងកណ្តឹងស្វាគមន៍ (Test Bell)">🔊 កណ្តឹង</button>
        <button class="sound-ctrl-btn" id="sound-mute" type="button" title="បើក/បិទសំឡេង (Mute/Unmute)">🔊 ឮ</button>
        <input type="range" id="sound-volume" class="sound-volume-slider" min="0" max="1" step="0.05" value="1" title="កម្រិតសំឡេង (Volume)">
        <div class="tv-clock" id="display-clock">--:--</div>
      </div>
    </header>

    <!-- 5-ROW QUEUE TABLE SECTION -->
    <section class="tv-waiting-section" aria-label="តារាងរង់ចាំ">
      <div class="tv-waiting-head">
        <div class="tv-wcol-num"><span style="display:none">ល.រ</span>លេខរៀង / No.</div>
        <div class="tv-wcol-name">ឈ្មោះ / Name</div>
        <div class="tv-wcol-counter">ទៅកាន់ / Counter</div>
      </div>
      <div class="tv-waiting-list" id="queue-display-rows">
        <!-- 5 rows dynamically rendered -->
      </div>
    </section>
  </main>
</body>
</html>
