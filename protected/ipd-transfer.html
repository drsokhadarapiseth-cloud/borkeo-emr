<!doctype html>
<html lang="km"><head><meta charset="utf-8"><meta name="viewport" content="width=1200, user-scalable=yes">
<title>បញ្ជូនអ្នកជំងឺទៅ IPD · Borkeo EMR</title>
<link rel="stylesheet" href="/public/ocean-theme.css"><link rel="stylesheet" href="/public/emr-session.css?v=1560"><link rel="stylesheet" href="/public/ipd-transfer.css?v=1560">
<script src="/public/emr-session.js?v=1970" defer></script><script src="/public/ipd-transfer.js?v=1560" defer></script><link rel="stylesheet" href="/public/responsive-layout.css?v=1310"></head>
<body><main class="transfer-shell"><header class="transfer-heading" data-session-host><div><h1>បញ្ជូនអ្នកជំងឺទៅ IPD</h1><p>ជ្រើសរើសអ្នកជំងឺពី OPD និងបញ្ជូនទៅផ្នែកសម្រាក</p></div></header>
<section class="transfer-toolbar"><label>ស្វែងរកអ្នកជំងឺ<input id="transfer-search" type="search" placeholder="ឈ្មោះ លេខករណី ឬលេខបណ្ណសុខភាព"></label><button id="transfer-refresh" type="button">ទាញទិន្នន័យ</button><span id="transfer-count" aria-live="polite"></span></section>
<p id="transfer-status" role="status"></p><div id="transfer-list" class="transfer-list"></div>
<dialog id="transfer-dialog"><form method="dialog"><h2>បញ្ជូនអ្នកជំងឺទៅសម្រាក IPD</h2><p data-transfer-patient></p><label>ជ្រើសរើសផ្នែកសម្រាក<select data-transfer-ward required></select></label><p class="transfer-dialog-status" data-transfer-status role="status"></p><div class="transfer-actions"><button type="button" data-transfer-cancel>បោះបង់</button><button type="button" class="primary" data-transfer-confirm>បញ្ជូនទៅ IPD</button></div></form></dialog>
</main></body></html>
