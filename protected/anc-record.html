<!doctype html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>កំណត់ត្រាការពិនិត្យផ្ទៃពោះមុនសម្រាល</title>
<!-- v42.6: the official Ministry of Health ANC record (pages 2-5), one per
     pregnancy, with the colour code (page 6), the visit schedule (pages 7-8)
     and the "to do at this visit" panel. Labels come from
     server/catalogues/anc-record-labels.json. -->
<link rel="stylesheet" href="/public/emr-session.css?v=3700">
<link rel="stylesheet" href="/public/responsive-layout.css?v=3045">
<link rel="stylesheet" href="/public/anc-record.css?v=4260">
<script src="/public/emr-session.js?v=3700" defer></script>
<script type="module" src="/public/anc-record.js?v=4260"></script>
</head>
<body class="anc-page">
<main class="anc-shell" id="main-content">
  <div data-session-host class="no-print"></div>
  <header class="anc-top">
    <img class="anc-logo" src="/public/logo-hospital.jpg" alt="">
    <h1 id="anc-title"></h1>
    <div class="anc-colour-boxes" id="anc-colour-boxes"></div>
  </header>
  <p id="anc-status" role="status" aria-live="polite" class="no-print"></p>
  <section class="anc-summary" id="anc-summary"></section>
  <nav id="anc-sections" class="anc-sections no-print" aria-label="ANC"></nav>
  <div class="anc-layout">
    <aside class="anc-tasks no-print" id="anc-tasks" aria-labelledby="anc-tasks-title"></aside>
    <div class="anc-main" id="anc-main"></div>
  </div>
</main>
<dialog id="anc-tasks-dialog" class="anc-dialog no-print"></dialog>
<dialog id="anc-close-dialog" class="anc-dialog no-print"></dialog>
<div id="anc-print" class="anc-print" aria-hidden="true"></div>
</body>
</html>
