<!doctype html>
<html lang="km">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1200, user-scalable=yes">
  <title>ជ្រើសរើសតួនាទី និងផ្នែក — Borkeo EMR</title>
  <link rel="stylesheet" href="/public/ocean-theme.css">
  <link rel="stylesheet" href="/public/context.css">
  <script src="/public/organization-branding.js?v=1560" defer></script><script src="/public/context.js" defer></script>
  <link rel="stylesheet" href="/public/responsive-layout.css?v=1310">
</head>
<body>
  <main class="context-shell">
    <section class="context-card">
      <img src="/public/logo-hospital.jpg" alt="Borkeo Referral Hospital" class="context-logo">
      <p class="eyebrow">មន្ទីរពេទ្យបង្អែក បរកែវ</p>
      <h1>ជ្រើសរើសតួនាទី និងផ្នែកការងារ</h1>
      <p class="help">ជ្រើសរើសតួនាទីដែលអ្នកកំពុងបំពេញ និងផ្នែកដែលអ្នកកំពុងធ្វើការ។ ប្រព័ន្ធនឹងបង្ហាញតែអ្នកជំងឺ និងទម្រង់ដែលអ្នកមានសិទ្ធិ។</p>
      <form id="context-form">
        <label for="context-role">តួនាទី</label>
        <select id="context-role" required></select>
        <label for="context-ward" id="ward-label">ផ្នែក</label>
        <select id="context-ward"></select>
        <div id="context-status" role="alert" aria-live="polite"></div>
        <button type="submit">ចូលប្រើ EMR</button>
      </form>
    </section>
  </main>
</body>
</html>
