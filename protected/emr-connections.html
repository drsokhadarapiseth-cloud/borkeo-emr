<!doctype html><html lang="km"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ការតភ្ជាប់ API រវាងមូលដ្ឋានសុខាភិបាល</title><link rel="stylesheet" href="/public/emr-session.css?v=3700"><link rel="stylesheet" href="/public/responsive-layout.css?v=3045"><link rel="stylesheet" href="/public/emr-network.css?v=4970"><script src="/public/emr-session.js?v=3700" defer></script></head><body><main class="network-shell"><h1>ការតភ្ជាប់ API រវាងមូលដ្ឋានសុខាភិបាល</h1><p data-network-status role="status"></p>
<section class="network-card"><h2>សោ API របស់មូលដ្ឋាន</h2><form data-local-form><label>ឈ្មោះមូលដ្ឋានសុខាភិបាល<input name="name" required maxlength="160"></label><label class="network-check"><input type="checkbox" name="enabled">បើក API</label><p data-local-key-hint></p><div class="network-actions"><button type="submit">រក្សាទុក</button><button type="button" data-copy-key>ចម្លងសោ</button><button type="button" data-rotate-key>បង្កើតសោថ្មី</button></div></form></section>
<section class="network-card"><h2>មូលដ្ឋានសុខាភិបាលដែលបានអនុញ្ញាត</h2><div data-peer-list></div></section>
<section class="network-card"><h2>បន្ថែម ឬកែការតភ្ជាប់</h2><form data-peer-form><label>ឈ្មោះមូលដ្ឋានសុខាភិបាល<input name="name" required maxlength="160"></label><label>អាសយដ្ឋាន EMR<input name="origin" type="url" required placeholder="http://localhost:3002"></label><label>សោ API ពីមូលដ្ឋានផ្សេង<input name="apiKey" type="password" autocomplete="off" maxlength="180"></label><div class="network-permissions"><label><input type="checkbox" name="enabled">បើកការតភ្ជាប់</label><label><input type="checkbox" name="incoming">អនុញ្ញាតសំណើចូល</label><label><input type="checkbox" name="outgoing">អនុញ្ញាតសំណើចេញ</label><label><input type="checkbox" name="search">អនុញ្ញាតស្វែងរកអ្នកជំងឺ</label><label><input type="checkbox" name="messages">អនុញ្ញាតសារវេជ្ជបណ្ឌិត</label></div><div class="network-actions"><button type="submit">រក្សាទុក</button><button type="button" data-new-peer>បន្ថែមថ្មី</button></div></form></section>
</main><script type="module" src="/public/emr-connections.mjs?v=4970"></script></body></html>
