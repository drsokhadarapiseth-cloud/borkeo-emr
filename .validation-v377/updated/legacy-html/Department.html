<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMR Hospital Mapping & Admissions</title>
    <style>
        :root {
            --free-bed: #0099cc; 
            --occupied-bed: #ff4d4d;
            --bg-main: #eef2f5;
            --card-bg: #ffffff;
            --text-main: #2b3643;
            --text-muted: #8294a5;
            --accent: #34495e;
            --success: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            padding: 20px;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #dde4eb;
        }

        .dashboard-header h1 {
            font-size: 22px;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        button:hover { background-color: #2c3e50; transform: translateY(-1px); }

        /* Main Layout */
        .layout-container {
            display: flex;
            gap: 20px;
            flex: 1;
            overflow: hidden;
        }

        /* Map Section (Left) */
        .map-section {
            flex: 3;
            overflow-y: auto;
            padding-right: 10px;
        }

        #hospital-map {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 20px;
        }

        /* Sidebar Section (Right) */
        .sidebar {
            flex: 1;
            min-width: 320px;
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #e1e8ed;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f4f8;
        }

        .sidebar-header h2 { font-size: 16px; }
        
        .add-admission-btn { background-color: var(--success); }
        .add-admission-btn:hover { background-color: #0e9f6e; }

        .waitlist-group { margin-bottom: 20px; }
        .waitlist-group h3 { font-size: 13px; color: var(--text-muted); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px;}
        
        .waitlist-item {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .waitlist-info { display: flex; flex-direction: column; gap: 4px; }
        .waitlist-name { font-weight: 600; font-size: 14px; }
        .waitlist-meta { font-size: 12px; color: var(--text-muted); }
        .waitlist-id { font-family: monospace; font-size: 11px; background: #e2e8f0; padding: 2px 6px; border-radius: 4px; color: #475569; display: inline-block; margin-bottom: 2px; width: max-content;}

        /* Department Cards & Beds */
        .department-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            border: 1px solid #e1e8ed;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .dept-header { display: flex; justify-content: space-between; align-items: center; }
        .dept-header h2 { font-size: 16px; }
        .add-btn-secondary { background: #f0f4f8; color: var(--text-main); border: 1px solid #d9e2ec; padding: 4px 10px; }
        .add-btn-secondary:hover { background: #e2e8f0; }

        .room-section { background: #f8fafc; border-radius: 8px; padding: 12px; border: 1px solid #e2e8f0; }
        .room-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 13px; font-weight: 600; color: var(--text-muted); }
        
        .bed-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; }
        .bed {
            position: relative; border-radius: 8px; padding: 12px 5px 8px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: white; cursor: pointer; transition: all 0.2s ease; min-height: 105px;
        }
        .bed:hover { filter: brightness(1.1); transform: translateY(-2px); }
        .bed.free { background-color: var(--free-bed); }
        .bed.occupied { background-color: var(--occupied-bed); }
        .bed-number { position: absolute; top: 4px; left: 4px; background: rgba(255,255,255,0.25); font-size: 10px; font-weight: bold; padding: 2px 5px; border-radius: 4px; }
        .bed-icon { width: 22px; height: 22px; fill: white; margin: 4px 0; }
        
        /* Patient Details on Bed */
        .patient-details { display: flex; flex-direction: column; align-items: center; width: 100%; gap: 2px;}
        .patient-id-badge { font-size: 9px; background: rgba(0,0,0,0.15); padding: 2px 6px; border-radius: 10px; margin-bottom: 2px; }
        .patient-name { font-size: 11px; font-weight: bold; text-align: center; width: 95%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .patient-meta { font-size: 9px; opacity: 0.95; font-weight: 500; }

        /* Modals */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;
        }
        .modal-content { background: white; padding: 25px; border-radius: 12px; width: 420px; max-height: 85vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-header h2 { font-size: 18px; margin: 0; }
        .close-btn { background: none; color: #888; font-size: 20px; padding: 0; }
        .close-btn:hover { color: #333; background: none; }

        /* Form Inputs */
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 5px; color: var(--text-muted); }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #d9e2ec; border-radius: 6px; font-size: 14px; }
        .form-submit { width: 100%; background: var(--success); padding: 12px; font-size: 15px; margin-top: 10px; }

        /* Select Patient List in Modal */
        .modal-patient-list { display: flex; flex-direction: column; gap: 8px; }
        .modal-patient-item { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 12px; border: 1px solid #e2e8f0; border-radius: 6px; cursor: pointer; transition: background 0.2s;
        }
        .modal-patient-item:hover { background: #f0f4f8; border-color: var(--free-bed); }
        .no-patients { text-align: center; color: var(--text-muted); padding: 20px; font-size: 14px; border: 1px dashed #ccc; border-radius: 6px; }

    </style>
</head>
<body>

    <div class="dashboard-header">
        <h1>
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>
            Hospital EMR & Admissions Map
        </h1>
        <div>
            <button onclick="addDepartment()">+ New Department</button>
        </div>
    </div>

    <div class="layout-container">
        <!-- Left: Hospital Map -->
        <div class="map-section" id="hospital-map">
            <!-- Rendered by JS -->
        </div>

        <!-- Right: Admissions Waitlist -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>Pending Admissions</h2>
                <button class="add-admission-btn" onclick="openNewAdmissionModal()">+ Add Patient</button>
            </div>
            <div id="waitlist-container">
                <!-- Rendered by JS -->
            </div>
        </div>
    </div>

    <!-- MODAL: Add New Patient to Waitlist -->
    <div class="modal-overlay" id="new-admission-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>New Admission</h2>
                <button class="close-btn" onclick="closeModals()">×</button>
            </div>
            <div class="form-group" style="display: flex; gap: 10px;">
                <div style="flex: 1;">
                    <label>Patient ID (EMR)</label>
                    <input type="text" id="adm-pid" placeholder="e.g. 000-000-000-0">
                </div>
                <div style="flex: 2;">
                    <label>Patient Name</label>
                    <input type="text" id="adm-name" placeholder="Patient Name">
                </div>
            </div>
            <div class="form-group" style="display: flex; gap: 10px;">
                <div style="flex: 1;">
                    <label>Age</label>
                    <input type="text" id="adm-age" placeholder="e.g. 35y, 6m">
                </div>
                <div style="flex: 1;">
                    <label>Sex</label>
                    <select id="adm-sex">
                        <option value="M">Male</option>
                        <option value="F">Female</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label>Target Department</label>
                <select id="adm-dept">
                    <!-- Populated by JS -->
                </select>
            </div>
            <button class="form-submit" onclick="saveNewAdmission()">Add to Waitlist</button>
        </div>
    </div>

    <!-- MODAL: Assign Patient to Bed -->
    <div class="modal-overlay" id="assign-bed-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Assign Patient to Bed</h2>
                <button class="close-btn" onclick="closeModals()">×</button>
            </div>
            <p style="font-size: 13px; color: #666; margin-bottom: 15px;">Select a pending patient from this department's waitlist:</p>
            <div class="modal-patient-list" id="modal-patient-list">
                <!-- Populated by JS -->
            </div>
        </div>
    </div>

    <script>
        function generateId() { return Math.random().toString(36).substr(2, 9); }

        // Data: Hospital Structure (All beds are now empty)
        let hospitalData = [
            { id: "dept_er", name: "Emergency", rooms: [{ id: generateId(), name: "Trauma 1", beds: [{ id: generateId(), bedNumber: "01", occupied: false, patient: null }]}] },
            { id: "dept_icu", name: "ICU", rooms: [] },
            { id: "dept_surg", name: "Surgery", rooms: [] },
            { id: "dept_med", name: "Medicine", rooms: [] },
            { id: "dept_ped", name: "Pediatric", rooms: [] },
            { id: "dept_ncu", name: "NCU", rooms: [{ id: generateId(), name: "NICU A", beds: [{ id: generateId(), bedNumber: "01", occupied: false, patient: null }, { id: generateId(), bedNumber: "02", occupied: false, patient: null }]}] },
            { id: "dept_gyn", name: "Gyneco-Obstetric", rooms: [] }
        ];

        // Data: Pending Admissions (Emptied out as requested)
        let pendingAdmissions = [];

        // State for assigning beds
        let targetBedData = null; 

        const bedSvg = `<svg class="bed-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M19,7H5C3.89,7 3,7.89 3,9V17H5V15H19V17H21V9C21,7.89 20.1,7 19,7M11,9V11H13V9H11M19,13H5V9H9V12H15V9H19V13Z" />
        </svg>`;

        function renderUI() {
            renderMap();
            renderWaitlist();
        }

        // --- RENDER MAP ---
        function renderMap() {
            const container = document.getElementById('hospital-map');
            container.innerHTML = ''; 

            hospitalData.forEach((dept, deptIndex) => {
                const deptCard = document.createElement('div');
                deptCard.className = 'department-card';
                
                let roomsHtml = '';
                dept.rooms.forEach((room, roomIndex) => {
                    let bedsHtml = '';
                    room.beds.forEach((bed, bedIndex) => {
                        const statusClass = bed.occupied ? 'occupied' : 'free';
                        
                        let patientHtml = bed.occupied 
                            ? `<div class="patient-details">
                                 <span class="patient-id-badge">${bed.patient.patientId}</span>
                                 <span class="patient-name">${bed.patient.name}</span>
                                 <span class="patient-meta">${bed.patient.age} | ${bed.patient.sex}</span>
                               </div>`
                            : `<div class="patient-details"><span class="patient-name">Free</span></div>`;
                        
                        bedsHtml += `
                            <div class="bed ${statusClass}" onclick="handleBedClick(${deptIndex}, ${roomIndex}, ${bedIndex})">
                                <div class="bed-number">#${bed.bedNumber}</div>
                                ${bedSvg}
                                ${patientHtml}
                            </div>
                        `;
                    });

                    roomsHtml += `
                        <div class="room-section">
                            <div class="room-header">
                                <span>${room.name}</span>
                                <button class="add-btn-secondary" style="font-size:11px;" onclick="addBed(${deptIndex}, ${roomIndex})">+ Bed</button>
                            </div>
                            <div class="bed-grid">${bedsHtml}</div>
                        </div>
                    `;
                });

                deptCard.innerHTML = `
                    <div class="dept-header">
                        <h2>${dept.name}</h2>
                        <button class="add-btn-secondary" onclick="addRoom(${deptIndex})">+ Room</button>
                    </div>
                    ${roomsHtml}
                `;
                container.appendChild(deptCard);
            });
        }

        // --- RENDER WAITLIST ---
        function renderWaitlist() {
            const container = document.getElementById('waitlist-container');
            container.innerHTML = '';

            hospitalData.forEach(dept => {
                const patientsInDept = pendingAdmissions.filter(p => p.deptId === dept.id);
                
                if (patientsInDept.length > 0) {
                    let groupHtml = `<div class="waitlist-group"><h3>${dept.name} (${patientsInDept.length})</h3>`;
                    
                    patientsInDept.forEach(patient => {
                        groupHtml += `
                            <div class="waitlist-item">
                                <div class="waitlist-info">
                                    <span class="waitlist-id">${patient.patientId}</span>
                                    <span class="waitlist-name">${patient.name}</span>
                                    <span class="waitlist-meta">${patient.age} • ${patient.sex}</span>
                                </div>
                            </div>
                        `;
                    });
                    groupHtml += `</div>`;
                    container.innerHTML += groupHtml;
                }
            });

            if (pendingAdmissions.length === 0) {
                container.innerHTML = `<div class="no-patients">No pending admissions. Click "+ Add Patient" to start.</div>`;
            }
        }

        // --- BED INTERACTIONS ---
        function handleBedClick(deptIndex, roomIndex, bedIndex) {
            const bed = hospitalData[deptIndex].rooms[roomIndex].beds[bedIndex];
            const dept = hospitalData[deptIndex];

            if (bed.occupied) {
                if(confirm(`Discharge patient ${bed.patient.name} (${bed.patient.patientId}) from Bed #${bed.bedNumber}?`)) {
                    bed.occupied = false;
                    bed.patient = null;
                    renderUI();
                }
            } else {
                targetBedData = { deptIndex, roomIndex, bedIndex };
                openAssignBedModal(dept.id, dept.name);
            }
        }

        // --- MODAL LOGIC ---
        function openNewAdmissionModal() {
            const select = document.getElementById('adm-dept');
            select.innerHTML = hospitalData.map(d => `<option value="${d.id}">${d.name}</option>`).join('');
            
            document.getElementById('adm-pid').value = '';
            document.getElementById('adm-name').value = '';
            document.getElementById('adm-age').value = '';
            
            document.getElementById('new-admission-modal').style.display = 'flex';
        }

        function saveNewAdmission() {
            const patientId = document.getElementById('adm-pid').value;
            const name = document.getElementById('adm-name').value;
            const age = document.getElementById('adm-age').value;
            const sex = document.getElementById('adm-sex').value;
            const deptId = document.getElementById('adm-dept').value;

            if(!patientId || !name || !age) return alert("Please enter ID, Name, and Age.");

            // Validation to ensure Patient ID is only numbers and hyphens
            const idRegex = /^[0-9\-]+$/;
            if (!idRegex.test(patientId)) {
                return alert("Patient ID must contain only numbers and hyphens (e.g., 000-000-000-0).");
            }

            pendingAdmissions.push({ id: generateId(), patientId, deptId, name, age, sex });
            closeModals();
            renderWaitlist();
        }

        function openAssignBedModal(deptId, deptName) {
            const listContainer = document.getElementById('modal-patient-list');
            listContainer.innerHTML = '';
            
            const availablePatients = pendingAdmissions.filter(p => p.deptId === deptId);

            if (availablePatients.length === 0) {
                listContainer.innerHTML = `<div class="no-patients">No pending admissions for ${deptName}.</div>`;
            } else {
                availablePatients.forEach(patient => {
                    listContainer.innerHTML += `
                        <div class="modal-patient-item" onclick="assignPatientToBed('${patient.id}')">
                            <div class="waitlist-info">
                                <span class="waitlist-id">${patient.patientId}</span>
                                <span class="waitlist-name">${patient.name}</span>
                                <span class="waitlist-meta">${patient.age} • ${patient.sex}</span>
                            </div>
                            <span style="color:var(--free-bed); font-size:12px; font-weight:bold;">Assign &rarr;</span>
                        </div>
                    `;
                });
            }

            document.getElementById('assign-bed-modal').style.display = 'flex';
        }

        function assignPatientToBed(patientIdStr) {
            const pIndex = pendingAdmissions.findIndex(p => p.id === patientIdStr);
            const patient = pendingAdmissions[pIndex];
            pendingAdmissions.splice(pIndex, 1); // Remove from waitlist

            const { deptIndex, roomIndex, bedIndex } = targetBedData;
            const bed = hospitalData[deptIndex].rooms[roomIndex].beds[bedIndex];
            
            bed.occupied = true;
            bed.patient = { 
                patientId: patient.patientId, 
                name: patient.name, 
                age: patient.age, 
                sex: patient.sex 
            };

            closeModals();
            renderUI();
        }

        function closeModals() {
            document.getElementById('new-admission-modal').style.display = 'none';
            document.getElementById('assign-bed-modal').style.display = 'none';
            targetBedData = null;
        }

        // --- ADD DEPT / ROOM / BED ---
        function addDepartment() {
            const name = prompt("Enter new Department name:");
            if (name) {
                hospitalData.push({ id: "dept_" + generateId(), name: name, rooms: [] });
                renderUI();
            }
        }
        function addRoom(deptIndex) {
            const name = prompt("Enter new Room name:");
            if (name) {
                hospitalData[deptIndex].rooms.push({ id: generateId(), name: name, beds: [] });
                renderUI();
            }
        }
        function addBed(deptIndex, roomIndex) {
            const currentBeds = hospitalData[deptIndex].rooms[roomIndex].beds;
            const nextNumber = String(currentBeds.length + 1).padStart(2, '0');
            currentBeds.push({ id: generateId(), bedNumber: nextNumber, occupied: false, patient: null });
            renderUI();
        }

        renderUI();
    </script>
</body>
</html>
