<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birth Spacing Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Khmer OS', 'Suwannaphum', sans-serif;
            padding: 20px;
        }
        .card {
            border: 1px solid #dee2e6;
            margin-bottom: 20px;
            border-radius: 6px;
            box-shadow: none;
        }
        /* Blue Header Style */
        .card-header-blue {
            background-color: #e9eff5;
            color: #0b5ed7;
            font-weight: bold;
            border-bottom: 1px solid #dee2e6;
            padding: 10px 15px;
            border-top-left-radius: 5px;
            border-top-right-radius: 5px;
        }
        /* Green Header Style */
        .card-header-green {
            background-color: #43a060;
            color: white;
            font-weight: bold;
            border-bottom: 1px solid #dee2e6;
            padding: 10px 15px;
            border-top-left-radius: 5px;
            border-top-right-radius: 5px;
        }
        .form-label {
            font-size: 0.9rem;
            color: #333;
            margin-bottom: 0.3rem;
        }
        .text-danger {
            color: #dc3545 !important;
        }
        .form-control, .form-select {
            font-size: 0.9rem;
            color: #6c757d;
        }
        .dashed-divider {
            border-top: 1px dashed #dee2e6;
            margin: 15px 0;
        }
        .form-check-label {
            font-size: 0.9rem;
            color: #555;
        }
        .btn-orange {
            background-color: #f05a28;
            color: white;
            border: none;
        }
        .btn-orange:hover {
            background-color: #d94a1b;
            color: white;
        }
        .btn-green {
            background-color: #43a060;
            color: white;
            border: none;
        }
        .btn-green:hover {
            background-color: #36854e;
            color: white;
        }
        .form-check-inline-custom {
            display: inline-block;
            margin-right: 1.5rem;
        }
    </style>
</head>
<body>

<div class="container-fluid bg-white p-4 rounded border">

    <!-- Maternity and Gynecology Section -->
    <div class="card">
        <div class="card-header-blue">ផ្នែកសម្ភព និងរោគស្ត្រី</div>
        <div class="card-body">
            
            <div class="row align-items-center mb-3">
                <div class="col-md-1">
                    <label class="form-label mb-0">ទម្រង់</label>
                </div>
                <div class="col-md-11">
                    <select class="form-select">
                        <option selected>ទម្រង់ពន្យារកំណើត</option>
                    </select>
                </div>
            </div>

            <div class="dashed-divider"></div>

            <div class="mb-3 d-flex align-items-center gap-4">
                <label class="form-label mb-0">ករណីជំងឺ <span class="text-danger">*</span></label>
                <div class="form-check mb-0">
                    <input class="form-check-input" type="radio" name="caseType" id="newCase">
                    <label class="form-check-label" for="newCase">ករណីថ្មី</label>
                </div>
                <div class="form-check mb-0">
                    <input class="form-check-input" type="radio" name="caseType" id="oldCase">
                    <label class="form-check-label" for="oldCase">ករណីចាស់</label>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">រោគសញ្ញា <span class="text-danger">*</span></label>
                <select class="form-select">
                    <option selected>ជ្រើសរើស</option>
                </select>
            </div>

            <div class="row">
                <div class="col-md-8">
                    <label class="form-label">រោគវិនិច្ឆ័យចូល ICD10 <span class="text-danger">*</span></label>
                    <select class="form-select">
                        <option selected>ជ្រើសរើស</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">សេវាអមវេជ្ជសាស្ត្រ <span class="text-danger">*</span></label>
                    <div class="d-flex gap-3 mt-1">
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="medicalService" id="medYes">
                            <label class="form-check-label" for="medYes">មាន</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="medicalService" id="medNo" checked>
                            <label class="form-check-label" for="medNo">មិនមាន</label>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Number of Children Section -->
    <div class="card">
        <div class="card-header-green">ចំនួនកូន</div>
        <div class="card-body">
            <div class="mb-2">
                <label class="form-label">ចំនួនកូន <span class="text-danger">*</span></label>
                <input type="text" class="form-control" placeholder="ចំនួនកូន">
            </div>
        </div>
    </div>

    <!-- Client Section -->
    <div class="card">
        <div class="card-header-green">អតិថិជន</div>
        <div class="card-body">
            <div class="mb-2">
                <label class="form-label d-block">អតិថិជន <span class="text-danger">*</span></label>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="clientStatus" id="firstTime">
                    <label class="form-check-label" for="firstTime">លើកដំបូង</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="clientStatus" id="usedBefore">
                    <label class="form-check-label" for="usedBefore">ធ្លាប់ប្រើ</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="clientStatus" id="oldClient">
                    <label class="form-check-label" for="oldClient">ចាស់</label>
                </div>
            </div>
        </div>
    </div>

    <!-- Counseling Section -->
    <div class="card">
        <div class="card-header-green">ការផ្តល់ប្រឹក្សា</div>
        <div class="card-body py-2">
            <div class="form-check my-2">
                <input class="form-check-input" type="checkbox" id="counselingCheck">
                <label class="form-check-label" for="counselingCheck">ការផ្តល់ប្រឹក្សា</label>
            </div>
        </div>
    </div>

    <!-- Referral Section -->
    <div class="card">
        <div class="card-header-green">បញ្ជូន</div>
        <div class="card-body py-2">
            <div class="d-flex gap-4 my-2">
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="referralType" id="referralPermanent">
                    <label class="form-check-label" for="referralPermanent">បញ្ជូនសម្រាប់ការការពន្យារកំណើតអចិន្ត្រៃយ៍</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="referralType" id="referralOther">
                    <label class="form-check-label" for="referralOther">បញ្ជូនសម្រាប់ការការពន្យារកំណើតផ្សេងទៀត</label>
                </div>
            </div>
        </div>
    </div>

    <!-- Birth Spacing Method Section -->
    <div class="card">
        <div class="card-header-green">មធ្យោបាយពន្យារកំណើត</div>
        <div class="card-body">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">មធ្យោបាយពន្យារកំណើត <span class="text-danger">*</span></label>
                    <select class="form-select">
                        <option selected>ជ្រើសរើស</option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">កាលបរិច្ឆេទ <span class="text-danger">*</span></label>
                    <input type="date" class="form-control" placeholder="ជ្រើសរើសកាលបរិច្ឆេទ">
                </div>
            </div>
        </div>
    </div>

    <!-- Action Buttons -->
    <div class="d-flex justify-content-end gap-2 mt-4 pb-2">
        <button type="button" class="btn btn-orange px-4">
            <i class="bi bi-arrow-left me-1"></i> ត្រឡប់ក្រោយ
        </button>
        <button type="button" class="btn btn-green px-4">
            <i class="bi bi-floppy me-1"></i> រក្សាទុក
        </button>
        <button type="button" class="btn btn-green px-4">
            រក្សាទុក និងបន្ត <i class="bi bi-arrow-right ms-1"></i>
        </button>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
