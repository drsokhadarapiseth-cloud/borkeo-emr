<!doctype html>
<html lang="km"><head><meta charset="utf-8"><meta name="viewport" content="width=1200, user-scalable=yes">
<title>ឈ្មោះ និងស្លាកសញ្ញាស្ថាប័ន</title><link rel="stylesheet" href="/public/ocean-theme.css"><link rel="stylesheet" href="/public/emr-session.css?v=1560"><link rel="stylesheet" href="/public/organization-branding.css?v=1560">
<script src="/public/emr-session.js?v=1970" defer></script><script src="/public/organization-branding-admin.js?v=1560" defer></script><link rel="stylesheet" href="/public/responsive-layout.css?v=1310"></head>
<body><main class="org-shell"><header class="org-heading" data-session-host><div><h1>ឈ្មោះ និងស្លាកសញ្ញាស្ថាប័ន</h1><p>ទំព័រនេះអាចកែប្រែបានដោយ Admin ប្រធាន និង អនុប្រធានមន្ទីរពេទ្យ។</p></div></header>
<form id="org-form" class="org-card"><label>ឈ្មោះស្ថាប័នជាភាសាខ្មែរ<input name="nameKh" maxlength="180" required></label><label>Facility name in English<input name="nameEn" maxlength="180" required></label>
<label>រូបសញ្ញា (PNG, JPEG ឬ WebP; រហូតដល់ 2 MB)<input name="logo" type="file" accept="image/png,image/jpeg,image/webp"></label><div class="org-preview"><img id="logo-preview" alt="Facility logo preview"><span id="logo-state"></span></div><label class="org-remove"><input name="removeLogo" type="checkbox"> លុបរូបសញ្ញាដែលបានដាក់ (ប្រើរូបសញ្ញាលំនាំដើម)</label>
<p id="org-status" role="status"></p><button type="submit">រក្សាទុកការកំណត់</button></form></main></body></html>
