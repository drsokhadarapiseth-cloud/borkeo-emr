<!doctype html><html lang="km"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Borkeo PMRS2 Helper</title>
<style>body{font:15px/1.8 sans-serif;margin:18px;width:320px;color:#16445b}label{display:block}input{box-sizing:border-box;width:100%;padding:10px;border:1px solid #b8d2de;border-radius:6px}button{margin-top:14px;padding:10px;background:#087b9a;color:white;border:0;border-radius:6px;font:inherit}p{overflow-wrap:anywhere}</style></head>
<body><h2>កម្មវិធីជំនួយ PMRS2</h2><p>កំណែ <span id="version"></span></p><label for="borkeoBaseUrl">អាសយដ្ឋានប្រព័ន្ធ Borkeo</label><input id="borkeoBaseUrl" type="url" placeholder="http://127.0.0.1:3001"><button id="save" type="button">រក្សាទុក</button><p id="saved" role="status" hidden></p><p>ចូលគណនី PMRS2 និង Borkeo ដោយខ្លួនឯង។ កម្មវិធីជំនួយមិនរក្សាទុកពាក្យសម្ងាត់ ឬលេខកូដផ្ទៀងផ្ទាត់ទេ។ ពិនិត្យព័ត៌មានអ្នកជំងឺមុនចុចរក្សាទុកក្នុងទម្រង់ចុះឈ្មោះ។</p><script type="module" src="options.js"></script></body></html>
