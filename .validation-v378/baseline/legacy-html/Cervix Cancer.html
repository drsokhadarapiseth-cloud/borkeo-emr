<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cervical Cancer Screening Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Khmer OS', 'Suwannaphum', sans-serif;
            padding: 20px;
        }
        .card {
            border: 1px solid #dee2e6;
            margin-bottom: 20px;
            border-radius: 6px;
            box-shadow: none;
        }
        /* Blue Header Style */
        .card-header-blue {
            background-color: #e9eff5;
            color: #0b5ed7;
            font-weight: bold;
            border-bottom: 1px solid #dee2e6;
            padding: 10px 15px;
            border-top-left-radius: 5px;
            border-top-right-radius: 5px;
        }
        /* Green Header Style */
        .card-header-green {
            background-color: #43a060;
            color: white;
            font-weight: bold;
            border-bottom: 1px solid #dee2e6;
            padding: 10px 15px;
            border-top-left-radius: 5px;
            border-top-right-radius: 5px;
        }
        .form-label {
            font-size: 0.9rem;
            color: #333;
            margin-bottom: 0.3rem;
        }
        .text-danger {
            color: #dc3545 !important;
        }
        .form-control, .form-select {
            font-size: 0.9rem;
            color: #6c757d;
        }
        .dashed-divider {
            border-top: 1px dashed #dee2e6;
            margin: 15px 0;
        }
        .form-check-label {
            font-size: 0.9rem;
            color: #555;
        }
        .btn-orange {
            background-color: #f05a28;
            color: white;
            border: none;
        }
        .btn-orange:hover {
            background-color: #d94a1b;
            color: white;
        }
        .btn-green {
            background-color: #43a060;
            color: white;
            border: none;
        }
        .btn-green:hover {
            background-color: #36854e;
            color: white;
        }
        .form-check-inline-custom {
            display: inline-block;
            margin-right: 1.5rem;
        }
    </style>
</head>
<body>

<div class="container-fluid bg-white p-4 rounded border">

    <!-- Maternity and Gynecology Section -->
    <div class="card">
        <div class="card-header-blue">ផ្នែកសម្ភព និងរោគស្ត្រី</div>
        <div class="card-body">
            
            <div class="row align-items-center mb-3">
                <div class="col-md-1">
                    <label class="form-label mb-0">ទម្រង់</label>
                </div>
                <div class="col-md-11">
                    <select class="form-select">
                        <option selected>ទម្រង់ស្រាវជ្រាវមហារីកផ្នែកសម្ភព និងរោគស្ត្រី</option>
                    </select>
                </div>
            </div>

            <div class="dashed-divider"></div>

            <div class="mb-3 d-flex align-items-center gap-4">
                <label class="form-label mb-0">ករណីជំងឺ <span class="text-danger">*</span></label>
                <div class="form-check mb-0">
                    <input class="form-check-input" type="radio" name="caseType" id="newCase">
                    <label class="form-check-label" for="newCase">ករណីថ្មី</label>
                </div>
                <div class="form-check mb-0">
                    <input class="form-check-input" type="radio" name="caseType" id="oldCase">
                    <label class="form-check-label" for="oldCase">ករណីចាស់</label>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">រោគសញ្ញា <span class="text-danger">*</span></label>
                <select class="form-select">
                    <option selected>ជ្រើសរើស</option>
                </select>
            </div>

            <div class="row">
                <div class="col-md-8">
                    <label class="form-label">រោគវិនិច្ឆ័យចូល ICD10 <span class="text-danger">*</span></label>
                    <select class="form-select">
                        <option selected>ជ្រើសរើស</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">សេវាអមវេជ្ជសាស្ត្រ <span class="text-danger">*</span></label>
                    <div class="d-flex gap-3 mt-1">
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="medicalService" id="medYes">
                            <label class="form-check-label" for="medYes">មាន</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="medicalService" id="medNo" checked>
                            <label class="form-check-label" for="medNo">មិនមាន</label>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Cervical Findings Section -->
    <div class="card border-bottom-0 rounded-bottom-0 mb-0">
        <div class="card-header-green">អត្ថសញ្ញាណបញ្ហារបស់មាត់ស្បូន</div>
        <div class="card-body pb-0">
            <div class="mb-2">
                <label class="form-label d-block">តេស្ត VIA <span class="text-danger">*</span></label>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="viaTest" id="viaPositive">
                    <label class="form-check-label" for="viaPositive">វិជ្ជមាន</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="viaTest" id="viaNegative">
                    <label class="form-check-label" for="viaNegative">អវិជ្ជមាន</label>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">បញ្ហាផ្សេងៗ</label>
                <input type="text" class="form-control">
            </div>
        </div>
    </div>

    <!-- Breast Self-Exam Section -->
    <div class="card border-top-0 rounded-top-0 mt-n4" style="margin-top: -1px;">
        <div class="card-header-green">អប់រំនិងស្ទាបដោះដោយខ្លួនឯង</div>
        <div class="card-body">
            <div class="mb-2">
                <label class="form-label d-block">អប់រំនិងស្ទាបដោះដោយខ្លួនឯង <span class="text-danger">*</span></label>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="breastExam" id="examYes">
                    <label class="form-check-label" for="examYes">បាទ/ចាស</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="breastExam" id="examNo">
                    <label class="form-check-label" for="examNo">ទេ</label>
                </div>
            </div>
        </div>
    </div>

    <!-- Breast Findings Section -->
    <div class="card">
        <div class="card-header-green">អត្ថសញ្ញាណបញ្ហារបស់ដោះ</div>
        <div class="card-body">
            <div class="row mb-3">
                <div class="col-md-6">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="lump">
                        <label class="form-check-label" for="lump">រលាក</label>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="discharge">
                        <label class="form-check-label" for="discharge">ដុំដោះ</label>
                    </div>
                </div>
                <div class="col-md-12">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="suspicious">
                        <label class="form-check-label" for="suspicious">សង្ស័យមហារីក</label>
                    </div>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">បញ្ហាផ្សេងៗ</label>
                <input type="text" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label d-block">បានព្យាបាល <span class="text-danger">*</span></label>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="treated" id="treatedYes">
                    <label class="form-check-label" for="treatedYes">បាន</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="treated" id="treatedNo">
                    <label class="form-check-label" for="treatedNo">មិនបាន</label>
                </div>
            </div>

            <div class="mb-2">
                <label class="form-label d-block">មកពិនិត្យ <span class="text-danger">*</span></label>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="visitType" id="visitNew">
                    <label class="form-check-label" for="visitNew">ថ្មី</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="visitType" id="visitFollowup">
                    <label class="form-check-label" for="visitFollowup">តាមដានបន្ត</label>
                </div>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="referralOut">
                <label class="form-check-label" for="referralOut">បញ្ជូនទៅកន្លែងផ្សេង</label>
            </div>
        </div>
    </div>

    <!-- Action Buttons -->
    <div class="d-flex justify-content-end gap-2 mt-4 pb-2">
        <button type="button" class="btn btn-orange px-4">
            <i class="bi bi-arrow-left me-1"></i> ត្រឡប់ក្រោយ
        </button>
        <button type="button" class="btn btn-green px-4">
            <i class="bi bi-floppy me-1"></i> រក្សាទុក
        </button>
        <button type="button" class="btn btn-green px-4">
            រក្សាទុក និងបន្ត <i class="bi bi-arrow-right ms-1"></i>
        </button>
    </div>

</div>

<!-- Scroll to top button (mockup based on screenshot) -->
<div style="position: fixed; bottom: 20px; right: 20px;">
    <button type="button" class="btn btn-green rounded-circle" style="width: 40px; height: 40px; padding: 0;">
        <i class="bi bi-chevron-up"></i>
    </button>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
