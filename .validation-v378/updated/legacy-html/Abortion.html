<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abortion and Maternal Mortality Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Khmer OS', 'Suwannaphum', sans-serif;
            padding: 20px;
        }
        .card {
            border: 1px solid #dee2e6;
            margin-bottom: 20px;
            border-radius: 6px;
            box-shadow: none;
        }
        /* Blue Header Style */
        .card-header-blue {
            background-color: #e9eff5;
            color: #0b5ed7;
            font-weight: bold;
            border-bottom: 1px solid #dee2e6;
            padding: 10px 15px;
            border-top-left-radius: 5px;
            border-top-right-radius: 5px;
        }
        /* Green Header Style */
        .card-header-green {
            background-color: #43a060;
            color: white;
            font-weight: bold;
            border-bottom: 1px solid #dee2e6;
            padding: 10px 15px;
            border-top-left-radius: 5px;
            border-top-right-radius: 5px;
        }
        .form-label {
            font-size: 0.9rem;
            color: #333;
            margin-bottom: 0.3rem;
        }
        .text-danger {
            color: #dc3545 !important;
        }
        .form-control, .form-select {
            font-size: 0.9rem;
            color: #6c757d;
        }
        .dashed-divider {
            border-top: 1px dashed #dee2e6;
            margin: 15px 0;
        }
        .form-check-label {
            font-size: 0.9rem;
            color: #555;
        }
        .btn-orange {
            background-color: #f05a28;
            color: white;
            border: none;
        }
        .btn-orange:hover {
            background-color: #d94a1b;
            color: white;
        }
        .btn-green {
            background-color: #43a060;
            color: white;
            border: none;
        }
        .btn-green:hover {
            background-color: #36854e;
            color: white;
        }
    </style>
</head>
<body>

<div class="container-fluid bg-white p-4 rounded border">

    <!-- Maternity and Gynecology Section -->
    <div class="card">
        <div class="card-header-blue">ផ្នែកសម្ភព និងរោគស្ត្រី</div>
        <div class="card-body">
            
            <div class="row align-items-center mb-3">
                <div class="col-md-1">
                    <label class="form-label mb-0">ទម្រង់</label>
                </div>
                <div class="col-md-11">
                    <select class="form-select">
                        <option selected>ផ្នែកការរលូត រំលូតកូន និងមរណភាពមាតា</option>
                    </select>
                </div>
            </div>

            <div class="dashed-divider"></div>

            <div class="mb-3 d-flex align-items-center gap-4">
                <label class="form-label mb-0">ករណីជំងឺ <span class="text-danger">*</span></label>
                <div class="form-check mb-0">
                    <input class="form-check-input" type="radio" name="caseType" id="newCase">
                    <label class="form-check-label" for="newCase">ករណីថ្មី</label>
                </div>
                <div class="form-check mb-0">
                    <input class="form-check-input" type="radio" name="caseType" id="oldCase">
                    <label class="form-check-label" for="oldCase">ករណីចាស់</label>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">រោគសញ្ញា <span class="text-danger">*</span></label>
                <select class="form-select">
                    <option selected>ជ្រើសរើស</option>
                </select>
            </div>

            <div class="row">
                <div class="col-md-8">
                    <label class="form-label">រោគវិនិច្ឆ័យចូល ICD10 <span class="text-danger">*</span></label>
                    <select class="form-select">
                        <option selected>ជ្រើសរើស</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">សេវាអមវេជ្ជសាស្ត្រ <span class="text-danger">*</span></label>
                    <div class="d-flex gap-3 mt-1">
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="medicalService" id="medYes">
                            <label class="form-check-label" for="medYes">មាន</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="medicalService" id="medNo" checked>
                            <label class="form-check-label" for="medNo">មិនមាន</label>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Spontaneous Abortion Section -->
    <div class="card">
        <div class="card-header-green">រលូតឯងៗ</div>
        <div class="card-body">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">ចំនួនសរុប <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" placeholder="សូមបញ្ចូល">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">ចំនួនបញ្ជូនចេញទៅ <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" placeholder="សូមបញ្ចូល">
                </div>
            </div>
        </div>
    </div>

    <!-- Induced Abortion Section -->
    <div class="card">
        <div class="card-header-green">រំលូត</div>
        <div class="card-body">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">ចំនួនសរុប <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" placeholder="សូមបញ្ចូល">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">ចំនួនបញ្ជូនចេញទៅ <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" placeholder="សូមបញ្ចូល">
                </div>
            </div>
        </div>
    </div>

    <!-- Maternal Mortality Causes Section -->
    <div class="card">
        <div class="card-header-green">មូលហេតុនៃភាពស្លាប់មាតា</div>
        <div class="card-body">
            <div class="row mb-3">
                <div class="col-md-6">
                    <div class="form-check mb-2">
                        <input class="form-check-input" type="checkbox" id="cause1">
                        <label class="form-check-label" for="cause1">ធ្លាក់ឈាម</label>
                    </div>
                    <div class="form-check mb-2">
                        <input class="form-check-input" type="checkbox" id="cause2">
                        <label class="form-check-label" for="cause2">ក្រឡាភ្លើង/ស្កន់ជាន់</label>
                    </div>
                    <div class="form-check mb-2">
                        <input class="form-check-input" type="checkbox" id="cause3">
                        <label class="form-check-label" for="cause3">រលូតឯងៗ</label>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-check mb-2">
                        <input class="form-check-input" type="checkbox" id="cause4">
                        <label class="form-check-label" for="cause4">សម្រាលកូនមិនរួច</label>
                    </div>
                    <div class="form-check mb-2">
                        <input class="form-check-input" type="checkbox" id="cause5">
                        <label class="form-check-label" for="cause5">រហែកស្បូន</label>
                    </div>
                    <div class="form-check mb-2">
                        <input class="form-check-input" type="checkbox" id="cause6">
                        <label class="form-check-label" for="cause6">រំលូត</label>
                    </div>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">មូលហេតុផ្សេងៗ</label>
                <input type="text" class="form-control">
            </div>
            
            <div class="mb-3">
                <label class="form-label">ផ្សេងៗ</label>
                <input type="text" class="form-control">
            </div>
        </div>
    </div>

</div>

<!-- Scroll to top button -->
<div style="position: fixed; bottom: 20px; right: 20px;">
    <button type="button" class="btn btn-green rounded-circle" style="width: 40px; height: 40px; padding: 0;">
        <i class="bi bi-chevron-up"></i>
    </button>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
